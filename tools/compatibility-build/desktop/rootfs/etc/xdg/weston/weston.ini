[core]
shell=desktop-shell.so
xwayland=true
idle-time=0
require-input=false

[shell]
background-color=0xff17202b
panel-color=0xf00d131b
panel-position=top
clock-format=minutes
locking=false
animation=none
close-animation=none
startup-animation=none
focus-animation=none

[keyboard]
# Wayland clients repeat keys themselves. Under instruction translation a key
# release can arrive late, so wait longer before repeating.
repeat-rate=25
repeat-delay=600

[output]
name=Virtual-1
mode=1280x720

[autolaunch]
path=/usr/local/bin/browser-welcome

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/foot
displayname=Terminal

[launcher]
icon=/usr/share/icons/browser-linux/minecraft-launcher.png
path=/usr/bin/foot --title=Minecraft-Launcher --hold /usr/local/bin/minecraft-launcher
displayname=Minecraft Launcher
