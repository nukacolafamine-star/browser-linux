<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linux session</title><link rel="stylesheet" href="assets/xterm.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="compatibility.css"></head>
<body class="guest-page">
  <div class="guest-toolbar"><button id="show-desktop">Wayland desktop</button><button id="show-console">Serial terminal</button><button id="save-disk" disabled hidden>Shut down &amp; save</button><span id="guest-status" role="status">Preparing Linux…</span></div>
  <p id="disk-note" class="muted"></p>
  <div id="desktop-panel" class="guest-display"><canvas id="canvas" tabindex="0" width="800" height="600" aria-label="Linux Wayland desktop"></canvas></div>
  <div id="console-panel"><div id="guest-terminal"></div><div class="key-strip" aria-label="Terminal special keys"><button data-input="escape">Esc</button><button data-input="tab">Tab</button><button data-input="interrupt">Ctrl+C</button><button data-input="up">↑</button><button data-input="down">↓</button></div></div>
  <details id="exchange-panel"><summary>Transfer files</summary><p class="muted">Files here are available in Linux at <code>/mnt/browser</code>. Copy them into the Linux disk before saving. The exchange itself is temporary; it holds up to 64 MiB.</p><div class="button-row"><button id="exchange-upload" disabled>Add files</button><button id="exchange-refresh" disabled>Refresh</button></div><input id="exchange-input" type="file" multiple hidden><p id="exchange-status" role="status"></p><ul id="exchange-files"></ul></details>
  <details><summary>Engine log</summary><pre id="engine-log" class="guest-log"></pre></details>
  <script src="assets/xterm.js"></script><script src="assets/addon-fit.js"></script><script type="module" src="compatibility-session.js"></script>
</body>
</html>
