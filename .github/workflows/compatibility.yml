# Isolated build only. This workflow cannot deploy Pages or change the repository.
name: Build browser Linux compatibility engine
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Build the emulator
        type: boolean
        default: true
      desktop:
        description: Build and verify the Debian desktop guest
        type: boolean
        default: true
      launcher:
        description: Also check that the official Minecraft Launcher installs and opens (downloads from Mojang)
        type: boolean
        default: true
      gpu:
        description: Build the experimental GPU (VirGL over WebGL 2) emulator variant
        type: boolean
        default: false
  push:
    branches: [feature/desktop-platform]
    paths:
      - 'tools/compatibility-build/**'
      - '.github/workflows/compatibility.yml'
permissions:
  contents: read
concurrency:
  group: browser-linux-compatibility-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compile:
    if: github.event_name != 'workflow_dispatch' || inputs.runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Prepare pinned source recipe
        run: node tools/compatibility-build/prepare-runtime.mjs
      - name: Cache the isolated compiler and library dependencies
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: tools/compatibility-build
          file: tools/compatibility-build/generated/runtime.Dockerfile
          target: qemu-emscripten-dev
          build-args: |
            QEMU_REPO_VERSION=8604ed49a3cde392890b014a8d5a959c8a2fe72a
            EMSDK_VERSION_QEMU=4.0.10
          cache-from: |
            type=gha,scope=browser-linux-qemu-dependencies
            type=gha,scope=browser-linux-qemu-proof
          cache-to: type=gha,mode=max,scope=browser-linux-qemu-dependencies
          outputs: type=cacheonly
      - name: Compile x86_64 emulator for the browser
        uses: docker/build-push-action@v6
        timeout-minutes: 40
        with:
          context: tools/compatibility-build
          file: tools/compatibility-build/generated/runtime.Dockerfile
          target: browser-linux-runtime
          build-args: |
            QEMU_REPO_VERSION=8604ed49a3cde392890b014a8d5a959c8a2fe72a
            EMSDK_VERSION_QEMU=4.0.10
            WASM_INITIAL_MEMORY_MIB=256
            WASM_MAXIMUM_MEMORY_PAGES=65535
          cache-from: |
            type=gha,scope=browser-linux-qemu-dependencies
            type=gha,scope=browser-linux-qemu-proof
          cache-to: type=gha,mode=max,scope=browser-linux-qemu-proof
          outputs: type=local,dest=compatibility-artifact
      - name: Record reproducibility inputs
        if: always()
        run: |
          mkdir -p compatibility-artifact/provenance
          cp tools/compatibility-build/generated/source-lock.json compatibility-artifact/provenance/
          cp tools/compatibility-build/runtime-stage.Dockerfile compatibility-artifact/provenance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux-runtime
          path: compatibility-artifact
          retention-days: 14
  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Prepare pinned source recipe
        run: node tools/compatibility-build/prepare-runtime.mjs
      - name: Compile the GPU emulator variant (VirGL over WebGL 2)
        uses: docker/build-push-action@v6
        timeout-minutes: 75
        with:
          context: tools/compatibility-build
          file: tools/compatibility-build/generated/runtime.Dockerfile
          target: browser-linux-gpu-runtime
          build-args: |
            QEMU_REPO_VERSION=8604ed49a3cde392890b014a8d5a959c8a2fe72a
            EMSDK_VERSION_QEMU=4.0.10
            WASM_INITIAL_MEMORY_MIB=256
            WASM_MAXIMUM_MEMORY_PAGES=65535
          cache-from: |
            type=gha,scope=browser-linux-qemu-dependencies
            type=gha,scope=browser-linux-qemu-proof
            type=gha,scope=browser-linux-qemu-gpu
          cache-to: type=gha,mode=max,scope=browser-linux-qemu-gpu
          outputs: type=local,dest=gpu-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux-runtime-gpu
          path: gpu-artifact
          retention-days: 14
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Debian desktop guest and its kernel
        uses: docker/build-push-action@v6
        timeout-minutes: 60
        with:
          context: tools/compatibility-build
          file: tools/compatibility-build/desktop/Dockerfile
          outputs: type=local,dest=desktop-artifact
          cache-from: type=gha,scope=browser-linux-desktop
          cache-to: type=gha,mode=max,scope=browser-linux-desktop
      - name: Install emulator only on the isolated CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 imagemagick
      - name: Verify the guest desktop with native software emulation
        timeout-minutes: 45
        run: |
          launcher_flag=--launcher
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.launcher }}" != true ]; then launcher_flag=; fi
          python3 tools/compatibility-build/verify-desktop.py desktop-artifact --startup-timeout 420 $launcher_flag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux-desktop
          path: desktop-artifact
          retention-days: 14
